# Konfigurasi Nginx untuk POS-SALES (Laravel) di VPS Ubuntu 24.04 + PHP 8.3-FPM.
#
# Cara pakai (di server, sebagai user dengan sudo):
#   sudo cp /var/www/pos-sales/deploy/nginx-pos-sales.conf /etc/nginx/sites-available/pos-sales
#   sudo nano /etc/nginx/sites-available/pos-sales      # ganti pos.contoh.com dengan domainmu
#   sudo ln -s /etc/nginx/sites-available/pos-sales /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pos.contoh.com              # aktifkan HTTPS (Certbot mengubah blok ini otomatis)

server {
    listen 80;
    listen [::]:80;
    server_name pos.contoh.com;

    # PENTING: root harus folder public/, bukan folder proyek.
    root /var/www/pos-sales/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Header keamanan dasar
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset hasil build (nama file berhash) boleh di-cache lama
    location ^~ /build/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    # Blokir file tersembunyi (.env, .git, dll.), kecuali .well-known untuk Certbot
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
